name: Generate OpenAPI PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDOCLY_TELEMETRY: 'off'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install documentation tools
        run: npm install --no-save --package-lock=false @redocly/cli@1.34.5 playwright@1.56.1

      - name: Install Chromium and Korean fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Build HTML from OpenAPI
        run: |
          mkdir -p dist
          npx redocly build-docs openapi.yaml --output dist/openapi.html --disableGoogleFont

      - name: Generate PDF
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const { resolve } = require('node:path');
          const { pathToFileURL } = require('node:url');

          (async () => {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage();
              page.setDefaultTimeout(120_000);
              await page.goto(pathToFileURL(resolve('dist/openapi.html')).href);
              await page.locator('[data-section-id^="operation/"]').first().waitFor();
              await page.addStyleTag({ content: `
                body { font-family: "Noto Sans CJK KR", sans-serif; }
                @media print {
                  .menu-content { display: none !important; }
                  .api-content { margin-left: 0 !important; width: 100% !important; }
                  pre { white-space: pre-wrap !important; overflow-wrap: anywhere; }
                }
              ` });
              await page.emulateMedia({ media: 'print' });
              await page.evaluate(() => document.fonts.ready);
              await page.pdf({
                path: 'dist/fitzza-api.pdf',
                format: 'A4',
                printBackground: true,
                margin: { top: '12mm', bottom: '12mm', left: '10mm', right: '10mm' },
                timeout: 120_000,
              });
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: fitzza-api-pdf
          path: dist/fitzza-api.pdf
          if-no-files-found: error
          retention-days: 30
