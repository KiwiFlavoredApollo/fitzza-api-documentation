openapi: 3.0.3
info:
  title: Fitzza API
  version: 1.0.0
  description: |-
    Fitzza 웹 애플리케이션이 사용하는 API 문서입니다.

    구현 기준: [fitzza_msa_finalproject develop](https://github.com/duckfairy-wak/fitzza_msa_finalproject/tree/e9dea86d8611b70c33651c5c5b4c0bc296f55503), 커밋 e9dea86d8611b70c33651c5c5b4c0bc296f55503 (2026-10-10 확인).
    컨트롤러, DTO, 검증 로직 및 게이트웨이 설정을 기준으로 작성했습니다. 배포 서버에 대한 실호출 검증은 하지 않았습니다.

    이 문서의 공개 API 경로에서는 /api 및 /api/v1 접두어를 생략했습니다. 상품·카테고리·찜 API는 상품 서비스 직접 호출 서버로 문서화했습니다.

        게이트웨이는 Bearer JWT로 사용자 ID를 확인하고 X-User-Id를 서비스에 전달합니다. 외부 클라이언트는 X-User-Id를 직접 보내지 않고 Authorization: Bearer 헤더를 사용합니다. 공개 조회 API에도 토큰을 보낼 수 있으나 만료·무효 토큰을 보내면 401이 반환될 수 있습니다.

    내부 API는 게이트웨이에 공개되지 않으며 서비스 주소로 직접 호출합니다. 내부 사용자 API는 X-Internal-Token이 필요합니다.
    주문·리뷰·알림 서비스에는 상태 조회만 구현되어 있습니다. 가상 피팅·추천은 골격 구현이며 실제 작업 큐/추론은 연결되지 않았습니다. Python API의 사용자·상품 ID는 UUID이며 Java 서비스의 정수 ID와 형식이 다릅니다.
servers:
  - url: https://api.fitzza.duckdns.org/v1
    description: 기존 문서의 운영 도메인. 배포·프록시 경로는 확인되지 않았습니다.
  - url: http://localhost:8080
    description: 로컬 게이트웨이
tags:
  - name: 회원
    description: 회원가입 및 중복 확인
  - name: 인증
    description: 로그인, 토큰 재발급 및 로그아웃
  - name: 프로필
    description: 내 프로필 및 신체 정보
  - name: 상품
    description: 상품 조회 및 등록. 상품 서비스 직접 호출
  - name: 카테고리
    description: 카테고리 트리
  - name: 찜
    description: 찜 목록 및 추가·해제. 상품 서비스 직접 호출
  - name: 게시글
    description: 커뮤니티 게시글 및 좋아요
  - name: 댓글
    description: 댓글·답글 및 좋아요
  - name: 투표
    description: 투표 게시글 및 결과
  - name: 가상 피팅
    description: 현재 작업 접수 골격만 구현
  - name: 추천
    description: 현재 빈 추천 결과를 반환하는 골격 구현
  - name: 서비스 상태
    description: 서비스별 상태 조회
  - name: 내부 사용자
    description: 서비스 간 호출. X-Internal-Token 필요
  - name: 내부 상품
    description: 서비스 간 상품·옵션 조회
  - name: 내부 찜
    description: 서비스 간 찜 소유 확인
paths:
  /auth/signup:
    post:
      tags:
        - 회원
      summary: 회원가입
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSignupRequest"
      responses:
        "201":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSignupResponse"
              example:
                userId: 1
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "409":
          description: 중복·투표 마감·동시 수정 충돌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
      x-source: user-service/src/main/java/com/fitzza/user/controller/UserController.java
  /users/check-email:
    get:
      tags:
        - 회원
      summary: 이메일 중복 확인
      operationId: checkEmail
      security: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
            maxLength: 255
            pattern: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$
            example: user@example.com
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAvailabilityResponse"
              example:
                available: true
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
      x-source: user-service/src/main/java/com/fitzza/user/controller/UserController.java
  /users/check-nickname:
    get:
      tags:
        - 회원
      summary: 닉네임 중복 확인
      operationId: checkNickname
      security: []
      parameters:
        - name: nickname
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 10
            pattern: ^[가-힣A-Za-z0-9]{2,10}$
            example: 핏짜유저
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAvailabilityResponse"
              example:
                available: true
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
      x-source: user-service/src/main/java/com/fitzza/user/controller/UserController.java
  /auth/signin:
    post:
      tags:
        - 인증
      summary: 로그인
      operationId: signin
      description: 성공 시 액세스 토큰, 리프레시 토큰, 사용자 ID 및 닉네임을 반환합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSignInRequest"
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSignInResponse"
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "401":
          description: 인증 정보 누락·오류 또는 토큰 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
      x-source: user-service/src/main/java/com/fitzza/user/controller/AuthController.java
  /auth/refresh:
    post:
      tags:
        - 인증
      summary: 토큰 재발급
      operationId: refreshTokens
      description: 리프레시 토큰을 한 번 소비하고 새 토큰 쌍을 발급합니다. 사용한 리프레시 토큰은 다시 사용할 수 없습니다. Authorization 헤더의 만료된 액세스 토큰은
        게이트웨이에서 검증하지 않습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRefreshTokenRequest"
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTokenResponse"
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "401":
          description: 인증 정보 누락·오류 또는 토큰 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
      x-source: user-service/src/main/java/com/fitzza/user/controller/AuthController.java
  /auth/signout:
    post:
      tags:
        - 인증
      summary: 로그아웃
      operationId: signout
      description: "리프레시 토큰이 필수입니다. Authorization: Bearer 헤더를 선택적으로 함께 보내면 해당 액세스 토큰도 블랙리스트에 등록합니다. 이미 폐기되었거나 알 수 없는
        리프레시 토큰으로 재요청해도 성공합니다. 성공 응답은 200이며 본문이 없습니다."
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRefreshTokenRequest"
      responses:
        "200":
          description: 요청 성공. 응답 본문 없음.
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
      x-source: user-service/src/main/java/com/fitzza/user/controller/AuthController.java
  /users/profile/options:
    get:
      tags:
        - 프로필
      summary: 프로필 선택지 조회
      operationId: getProfileOptions
      security: []
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileOptionsResponse"
      x-source: user-service/src/main/java/com/fitzza/user/controller/ProfileController.java
  /users/me:
    get:
      tags:
        - 프로필
      summary: 내 프로필 조회
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMyProfileResponse"
        "401":
          description: 인증 정보 누락·오류 또는 토큰 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "404":
          description: 대상을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "503":
          description: 인증 상태 확인 불가 (AUTH_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
      x-source: user-service/src/main/java/com/fitzza/user/controller/ProfileController.java
  /users/me/body:
    patch:
      tags:
        - 프로필
      summary: 내 신체 정보 수정
      operationId: updateMyBody
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserBodyUpdate"
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUserBodyResponse"
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "401":
          description: 인증 정보 누락·오류 또는 토큰 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "404":
          description: 대상을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "503":
          description: 인증 상태 확인 불가 (AUTH_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
      x-source: user-service/src/main/java/com/fitzza/user/controller/ProfileController.java
  /products:
    get:
      tags:
        - 상품
      summary: 상품 목록 조회
      operationId: listProducts
      description: HIDDEN 상품을 제외하고 카테고리 코드와 정렬 기준으로 조회합니다. 현재 게이트웨이 경로와 불일치하므로 상품 서비스를 직접 호출합니다.
      security: []
      parameters:
        - name: categoryL1
          in: query
          required: false
          schema:
            type: string
        - name: categoryL2
          in: query
          required: false
          schema:
            type: string
        - name: subcategory
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - LATEST
              - PRICE_ASC
              - PRICE_DESC
            default: LATEST
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      servers:
        - url: http://localhost:8082
          description: 상품 서비스 직접 호출 (게이트웨이에 이 경로가 등록되어 있지 않음)
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductApiErrorResponse"
      x-gateway-routed: false
      x-source: product-service/src/main/java/com/fitzza/product/product/controller/ProductController.java
    post:
      tags:
        - 상품
      summary: 상품 등록
      operationId: createProduct
      description: 상품과 옵션을 함께 등록합니다. 현재 컨트롤러에는 인증·관리자 권한 검사가 없습니다.
      security: []
      servers:
        - url: http://localhost:8082
          description: 상품 서비스 직접 호출 (게이트웨이에 이 경로가 등록되어 있지 않음)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductProductCreateRequest"
      responses:
        "201":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProductDetailResponse"
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductApiErrorResponse"
        "404":
          description: 대상을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductApiErrorResponse"
      x-gateway-routed: false
      x-source: product-service/src/main/java/com/fitzza/product/product/controller/ProductController.java
  /products/{productId}:
    get:
      tags:
        - 상품
      summary: 상품 상세 조회
      operationId: getProduct
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
      servers:
        - url: http://localhost:8082
          description: 상품 서비스 직접 호출 (게이트웨이에 이 경로가 등록되어 있지 않음)
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProductDetailResponse"
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductApiErrorResponse"
        "404":
          description: 대상을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductApiErrorResponse"
      x-gateway-routed: false
      x-source: product-service/src/main/java/com/fitzza/product/product/controller/ProductController.java
  /categories:
    get:
      tags:
        - 카테고리
      summary: 카테고리 트리 조회
      operationId: listCategories
      security: []
      servers:
        - url: http://localhost:8082
          description: 상품 서비스 직접 호출 (게이트웨이에 이 경로가 등록되어 있지 않음)
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCategoryResponse"
      x-gateway-routed: false
      x-source: product-service/src/main/java/com/fitzza/product/product/controller/CategoryController.java
  /wishlists:
    get:
      tags:
        - 찜
      summary: 찜 목록 조회
      operationId: listWishlists
      description: 사용자의 찜 상품을 최근 순으로 조회합니다. 현재 게이트웨이에 경로가 없습니다.
      security: []
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: 상품 서비스 직접 호출 시 필요한 사용자 ID. 실제 배포에서는 신뢰할 수 있는 게이트웨이에서 주입해야 합니다.
          schema:
            type: integer
            format: int64
            example: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      servers:
        - url: http://localhost:8082
          description: 상품 서비스 직접 호출 (게이트웨이에 이 경로가 등록되어 있지 않음)
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistPage"
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductApiErrorResponse"
      x-gateway-routed: false
      x-source: product-service/src/main/java/com/fitzza/product/wishlist/controller/WishlistController.java
    post:
      tags:
        - 찜
      summary: 찜 추가
      operationId: addWishlist
      description: 이미 찜한 상품이면 기존 항목을 반환합니다. 성공 응답은 200입니다.
      security: []
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: 상품 서비스 직접 호출 시 필요한 사용자 ID. 실제 배포에서는 신뢰할 수 있는 게이트웨이에서 주입해야 합니다.
          schema:
            type: integer
            format: int64
            example: 1
      servers:
        - url: http://localhost:8082
          description: 상품 서비스 직접 호출 (게이트웨이에 이 경로가 등록되어 있지 않음)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWishlistCreateRequest"
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductWishlistResponse"
        "400":
          description: 요청 형식 또는 입력값 오류
          content:
            application/json:
