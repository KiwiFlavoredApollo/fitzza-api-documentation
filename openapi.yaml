    UserErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    UserSignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          minLength: 1
          example: user@example.com
        password:
          type: string
          minLength: 1
          example: Example123
    UserSignInResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "Authorization: Bearer 헤더로 전송하는 JWT."
        refreshToken:
          type: string
          description: 재발급·로그아웃 요청 본문에 전송하는 토큰.
        userId:
          type: integer
          format: int64
        nickname:
          type: string
    UserMyProfileResponse:
      type: object
      properties:
        email:
          type: string
        nickname:
          type: string
        body:
          $ref: "#/components/schemas/UserUserBodyResponse"
    UserNicknameResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        nickname:
          type: string
          nullable: true
    UserOptionResponse:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
    UserProfileOptionsResponse:
      type: object
      properties:
        bodyTypes:
          type: array
          items:
            $ref: "#/components/schemas/UserOptionResponse"
        fits:
          type: array
          items:
            $ref: "#/components/schemas/UserOptionResponse"
        styles:
          type: array
          items:
            $ref: "#/components/schemas/UserOptionResponse"
    UserRefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: 로그인 또는 재발급 응답으로 받은 리프레시 토큰.
    UserSignupRequest:
      type: object
      required:
        - email
        - password
        - nickname
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          pattern: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 24
          pattern: ^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,24}$
          description: 영문과 숫자를 모두 포함해야 하며 특수문자는 허용하지 않습니다.
          example: Example123
        nickname:
          type: string
          minLength: 2
          maxLength: 10
          pattern: ^[가-힣A-Za-z0-9]{2,10}$
          example: 핏짜유저
    UserSignupResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
    UserTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "Authorization: Bearer 헤더로 전송하는 JWT."
        refreshToken:
          type: string
          description: 재발급·로그아웃 요청 본문에 전송하는 토큰.
    UserUserBodyResponse:
      type: object
      properties:
        height:
          type: number
          nullable: true
          minimum: 100
          maximum: 250
          description: 키(cm).
          example: 175
        weight:
          type: number
          nullable: true
          minimum: 20
          maximum: 300
          description: 체중(kg).
          example: 70
        gender:
          type: string
          enum:
            - W
            - M
            - null
          nullable: true
        bodyType:
          type: string
          enum:
            - SLIM
            - STANDARD
            - MUSCULAR
            - CHUBBY
            - null
          nullable: true
        preferredFit:
          type: string
          enum:
            - REGULAR
            - RELAXED
            - SLIM
            - OVERSIZED
            - CROPPED
            - null
          nullable: true
        preferredStyles:
          type: array
          items:
