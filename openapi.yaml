openapi: 3.0.3
info:
  title: Fitzza API
  version: 1.0.0
  description: >-

servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 서버
  - url: /
    description: 호출할 API 서버 원점을 설정하세요. 경로는 시트 기준에서 /api 접두어를 제거했습니다.
tags:
  - name: 회원
  - name: 프로필
  - name: 설문
  - name: 커뮤니티
  - name: 투표
  - name: 댓글
  - name: 알림
  - name: 상품
  - name: 찜
  - name: 장바구니
  - name: 월드컵
  - name: 주문
  - name: 리뷰
  - name: 추천
  - name: 피팅
  - name: 내부 통신
  - name: 운영 API
paths:
  /auth/signup:
    post:
      tags:
        - 회원
      summary: 회원가입
      operationId: postApiAuthSignup
      description: "이메일과 닉네임을 확인해 회원을 등록합니다. 중복 항목이 있으면 가입을 거부하고 해당 필드와 원인을 반환합니다."
      x-source-row: 2
      security: []
      responses:
        "201":
          description: 201 { userId }
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: integer
                    format: int64
        "409":
          description: 이메일 또는 닉네임 중복. 중복된 모든 필드와 원인을 errors 배열로 반환합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupConflict"
              examples:
                duplicateEmail:
                  summary: 이메일만 중복
                  value:
                    code: DUPLICATE_VALUE
                    message: 이미 사용 중인 회원 정보가 있습니다.
                    errors:
                      - field: email
                        reason: 이미 사용 중인 이메일입니다.
                duplicateNickname:
                  summary: 닉네임만 중복
                  value:
                    code: DUPLICATE_VALUE
                    message: 이미 사용 중인 회원 정보가 있습니다.
                    errors:
                      - field: nickname
                        reason: 이미 사용 중인 닉네임입니다.
                duplicateEmailAndNickname:
                  summary: 이메일과 닉네임 모두 중복
                  value:
                    code: DUPLICATE_VALUE
                    message: 이미 사용 중인 회원 정보가 있습니다.
                    errors:
                      - field: email
                        reason: 이미 사용 중인 이메일입니다.
                      - field: nickname
                        reason: 이미 사용 중인 닉네임입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: 비밀번호 규칙은 시트에 상세 정의되지 않았습니다.
                nickname:
                  type: string
              required:
                - email
                - password
                - nickname
  /auth/signin:
    post:
      tags:
        - 회원
      summary: 로그인
      operationId: postApiAuthSignin
      description: "이메일과 비밀번호로 로그인하고 Access Token과 Refresh Token을 발급합니다. 활성 계정만 로그인할 수 있습니다."
      x-source-row: 5
      security: []
      responses:
        "200":
          description: 200 { accessToken, refreshToken, userId, nickname }
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  userId:
                    type: integer
                    format: int64
                  nickname:
                    type: string
        "401":
          description: "401: FR-ACC-01 / 담당: 지현 / 401: 이메일·비밀번호 구분 없는 통합 오류"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: 비밀번호 규칙은 시트에 상세 정의되지 않았습니다.
              required:
                - email
                - password
  /auth/refresh:
    post:
      tags:
        - 회원
      summary: 토큰 재발급
      operationId: postApiAuthRefresh
      description: "유효한 Refresh Token으로 토큰을 재발급하고 사용한 Refresh Token을 폐기합니다."
      x-source-row: 6
      security: []
      responses:
        "200":
          description: 200 { accessToken, refreshToken }
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        "401":
          description: "401: FR-ACC-01 / 담당: 지현 / 401: 없거나 만료됐거나 이미 사용한 Refresh Token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
  /auth/signout:
    post:
      tags:
        - 회원
      summary: 로그아웃
      operationId: postApiAuthSignout
      description: "Refresh Token을 폐기합니다. Access Token도 전달하면 남은 유효기간 동안 해당 토큰을 차단합니다."
      x-source-row: 7
      security:
        - null
        - bearerAuth: []
      responses:
        "200":
          description: "200"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
  /users/me:
    get:
      tags:
        - 프로필
      summary: 내 프로필 조회
      operationId: getApiUsersMe
      description: "현재 사용자의 프로필과 신체 정보를 조회합니다. 입력하지 않은 항목은 null로 반환합니다."
      x-source-row: 10
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "200 { email, nickname, height, weight, gender, preferredFit,
            preferredStyles[], shoeSize }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  nickname:
                    type: string
                  height:
                    type: number
                    nullable: true
                  weight:
                    type: number
                    nullable: true
                  gender:
                    type: string
                    nullable: true
                  preferredFit:
                    type: string
                    nullable: true
                  preferredStyles:
                    type: array
                    items:
                      type: string
                    nullable: true
                  shoeSize:
                    type: number
                    nullable: true
        "401":
          description: 토큰 누락·만료·위조. 시트에 따르면 코드 없는 401.
    patch:
      tags:
        - 프로필
      summary: 프로필 저장·수정·삭제
      operationId: patchApiUsersMe
      description: "현재 사용자의 프로필을 저장하거나 수정합니다. 생략한 필드는 유지하고 null로 전달한 값은 삭제합니다."
      x-source-row: 11
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 200 { height, weight, gender, preferredFit, preferredStyles[], shoeSize }
          content:
            application/json:
              schema:
                type: object
                properties:
                  height:
                    type: number
                    nullable: true
                  weight:
                    type: number
                    nullable: true
                  gender:
                    type: string
                    nullable: true
                  preferredFit:
                    type: string
                    nullable: true
                  preferredStyles:
                    type: array
                    items:
                      type: string
                    nullable: true
                  shoeSize:
                    type: number
                    nullable: true
        "400":
          description: "400: FR-PRF-01, 02 / 담당: 지현 / 400: 단위·허용 범위 오류"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 토큰 누락·만료·위조. 시트에 따르면 코드 없는 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                height:
                  type: number
                  nullable: true
                weight:
                  type: number
                  nullable: true
                gender:
                  type: string
                  nullable: true
                preferredFit:
                  type: string
                  nullable: true
                preferredStyles:
                  type: array
                  items:
                    type: string
                  nullable: true
                shoeSize:
                  type: number
                  nullable: true
  /surveys:
    post:
      tags:
        - 설문
      summary: 사이즈 설문 작성
      operationId: postApiSurveys
      description: "본인의 주문 항목에 대한 사이즈 설문을 저장하고 추천에 사용할 선호 실측 정보를 갱신합니다."
      x-source-row: 12
      security:
        - bearerAuth: []
      responses:
        "201":
          description: 201 { surveyId }
          content:
            application/json:
              schema:
                type: object
                properties:
                  surveyId:
                    type: integer
                    format: int64
        "401":
          description: 토큰 만료(TOKEN_EXPIRED) 또는 무효(INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "403":
          description: "403: FR-ORD-02 / 담당: 지현 / 403: 타인 주문, 409: 이미 작성"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "409: FR-ORD-02 / 담당: 지현 / 403: 타인 주문, 409: 이미 작성"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 인증 확인 불가(AUTH_UNAVAILABLE), 잠시 후 재시도.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderItemId:
                  type: integer
                  format: int64
                sizeFeedback:
                  type: string
                  enum:
                    - SMALL
                    - FIT
                    - BIG
              required:
                - orderItemId
                - sizeFeedback
  /surveys/me:
    get:
      tags:
        - 설문
      summary: 내 설문 조회
      operationId: getApiSurveysMe
      description: "선택한 주문 항목에 대해 현재 사용자가 작성한 사이즈 설문을 조회합니다."
      x-source-row: 14
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 200 [{ surveyId, orderItemId, sizeFeedback }]
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    surveyId:
                      type: integer
                      format: int64
                    orderItemId:
                      type: integer
                      format: int64
                    sizeFeedback:
                      type: string
        "401":
          description: 토큰 만료(TOKEN_EXPIRED) 또는 무효(INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "503":
          description: 인증 확인 불가(AUTH_UNAVAILABLE), 잠시 후 재시도.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
      parameters:
        - name: orderItemIds
          in: query
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: false
  /community/posts:
    get:
      tags:
        - 커뮤니티
      summary: 게시글 목록
      operationId: getApiPosts
      description: "조건에 맞는 게시글을 최신순으로 조회합니다. 삭제된 글은 제외하고 결과가 없으면 빈 목록을 반환합니다."
      x-source-row: 15
      security: []
      responses:
        "200":
          description: "200 { content: [{ postId, title, category, postType, nickname, createdAt, thumbnailUrl,
            likeCount, commentCount }], page, totalPages }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        postId:
                          type: integer
                          format: int64
                        title:
                          type: string
                        category:
                          type: string
                        postType:
                          type: string
                        nickname:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        thumbnailUrl:
                          type: string
                          format: uri
                        likeCount:
                          type: integer
                        commentCount:
                          type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - FASHION
              - COORDI_QUESTION
              - DAILY
        - name: postType
          in: query
          required: false
          schema:
            type: string
            enum:
              - VOTE
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: size
          in: query
          required: false
          schema:
            type: integer
    post:
      tags:
        - 커뮤니티
      summary: 게시글 작성
      operationId: postApiPosts
      description: "게시글을 작성합니다. 공유 게시글은 공유 대상의 소유권을 확인하고 스냅샷을 저장합니다."
      x-source-row: 17
      security:
        - bearerAuth: []
      responses:
        "201":
          description: 201 { postId }
          content:
            application/json:
              schema:
                type: object
                properties:
                  postId:
                    type: integer
                    format: int64
        "401":
          description: 토큰 만료(TOKEN_EXPIRED) 또는 무효(INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "503":
          description: 인증 확인 불가(AUTH_UNAVAILABLE), 잠시 후 재시도.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                category:
                  type: string
                  enum:
                    - FASHION
                    - COORDI_QUESTION
                    - DAILY
                imageUrl:
                  type: string
                  format: uri
                sharedType:
                  type: string
                sharedId:
                  type: integer
                  format: int64
              required:
                - title
                - content
                - category
  /community/posts/{postId}:
    get:
      tags:
        - 커뮤니티
      summary: 게시글 상세
      operationId: getApiPostsPostId
      description: "게시글 상세 정보를 조회하고 조회수를 증가시킵니다. 로그인한 경우 사용자의 좋아요 여부도 반환합니다."
      x-source-row: 16
      security:
        - null
        - bearerAuth: []
      responses:
        "200":
          description: "200 { postId, title, content, category, postType, author, imageUrl, shared: { type, id, snapshot
            }, voteOptions[], voteEndAt, voteClosed, likeCount, liked, viewCount, createdAt }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  postId:
                    type: integer
                    format: int64
                  title:
                    type: string
                  content:
                    type: string
                  category:
                    type: string
                  postType:
                    type: string
                  author:
                    type: object
                    additionalProperties: true
                    description: 세부 필드와 타입은 시트에 정의되지 않았습니다.
                  imageUrl:
                    type: string
                    format: uri
                  shared:
                    type: object
                    properties:
                      type:
                        type: string
                      id:
                        type: integer
                        format: int64
                      snapshot:
                        type: object
                        additionalProperties: true
                        description: 세부 필드와 타입은 시트에 정의되지 않았습니다.
                  voteOptions:
                    type: array
                    items:
                      type: object
                      properties:
                        voteOptionId:
                          type: integer
                          format: int64
                        source:
                          type: string
                          enum:
                            - AI_RECOMMEND
                            - WISHLIST
                            - UPLOAD
                        itemType:
                          type: string
                          enum:
                            - PRODUCT
                            - COMBO
                            - IMAGE
                        itemId:
                          type: integer
                          format: int64
                        imageUrl:
                          type: string
                          format: uri
                      additionalProperties: true
                  voteEndAt:
                    type: string
                    format: date-time
                  voteClosed:
                    type: boolean
                  likeCount:
                    type: integer
                  liked:
                    type: boolean
                  viewCount:
                    type: integer
                  createdAt:
                    type: string
                    format: date-time
        "404":
          description: "404: FR-COM-01 / 담당: 지현 / 404: 없거나 삭제된 글"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
    patch:
      tags:
        - 커뮤니티
      summary: 게시글 수정
      operationId: patchApiPostsPostId
      description: "본인이 작성한 게시글을 수정합니다. 투표 참여자가 있으면 투표 선택지는 변경할 수 없습니다."
      x-source-row: 19
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "200"
        "401":
          description: 토큰 만료(TOKEN_EXPIRED) 또는 무효(INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "403":
          description: "403: FR-COM-01, 06 / 담당: 지현 / 403, 409 / 409 CONCURRENT_UPDATE: 다른 수정·삭제 요청과 겹침 — 새로고침 후 재시도"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "수정·삭제 요청 충돌: CONCURRENT_UPDATE. 새로고침 후 재시도."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 인증 확인 불가(AUTH_UNAVAILABLE), 잠시 후 재시도.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                category:
                  type: string
                imageUrl:
                  type: string
                  format: uri
                options:
                  type: array
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                        enum:
                          - AI_RECOMMEND
                          - WISHLIST
                          - UPLOAD
                      itemType:
                        type: string
                        enum:
                          - PRODUCT
                          - COMBO
                          - IMAGE
                      itemId:
                        type: integer
                        format: int64
                      imageUrl:
                        type: string
                        format: uri
                  minItems: 2
                  maxItems: 4
    delete:
      tags:
        - 커뮤니티
      summary: 게시글 삭제
      operationId: deleteApiPostsPostId
      description: "본인이 작성한 게시글을 소프트 삭제합니다."
      x-source-row: 20
      security:
        - bearerAuth: []
      responses:
        "204":
          description: "204"
        "401":
          description: 토큰 만료(TOKEN_EXPIRED) 또는 무효(INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "403":
          description: "403: FR-COM-01 / 담당: 지현 / 403 / 409 CONCURRENT_UPDATE: 다른 수정·삭제 요청과 겹침 — 새로고침 후 재시도"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "수정·삭제 요청 충돌: CONCURRENT_UPDATE. 새로고침 후 재시도."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 인증 확인 불가(AUTH_UNAVAILABLE), 잠시 후 재시도.
          content:
            application/json:
              schema:
