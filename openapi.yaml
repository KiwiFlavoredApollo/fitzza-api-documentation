openapi: 3.0.3
info:
  title: Fitzza API
  version: 1.0.0
  description: >-
    API 명세서 시트 기준 (2026-10-12).

    원본: https://docs.google.com/spreadsheets/d/11iPQ3YFhEUBNp-2VAse4qQpHFEm6ymTOGz5_9-XCA6Y/edit?gid=308248600

    시트의 /api 경로와 인증 여부를 그대로 반영했습니다. README의 별도 경로 변경안과 기존 구현 기준 문서는 적용하지 않았습니다.

    시트는 필드 이름 중심의 계약입니다. ID는 정수, 금액·점수·치수는 숫자, 일시는 date-time으로 모델링했으며 실제 타입과 상세 검증 범위는 백엔드 확인이 필요합니다. 미정인 객체
    구조는 열린 스키마로 표현하고 요청 필수 여부는 명시된 조건과 기능에 필요한 필드를 기준으로 작성했습니다.

    내부·운영 API의 서비스별 호스트 및 사용자 API의 실제 배포 경로는 시트에 정의되지 않았습니다.

    Gateway는 Authorization이 있으면 검증합니다. /api/users/**는 토큰 누락·만료·위조 시 코드 없는 401을 반환한다는 공통 설명이 있으나 회원가입·중복 확인·선택지
    조회 행은 인증 N으로 지정되어 있어 확인이 필요합니다. /api/auth/**는 Gateway 토큰 검증 없이 통과합니다.
servers:
  - url: /
    description: 호출할 API 서버 원점을 설정하세요. 경로는 시트 기준입니다.
tags:
  - name: 회원
  - name: 프로필
  - name: 설문
  - name: 커뮤니티
  - name: 투표
  - name: 댓글
  - name: 알림
  - name: 상품
  - name: 찜
  - name: 장바구니
  - name: 월드컵
  - name: 주문
  - name: 리뷰
  - name: 추천
  - name: 피팅
  - name: 내부 통신
  - name: 운영 API
paths:
  /api/users/signup:
    post:
      tags:
        - 회원
      summary: 회원가입
      operationId: postApiUsersSignup
      description: |-
        이메일 형식·비밀번호 규칙 검증, 비밀번호 BCrypt 저장, 빈 신체정보 행 생성

        FR-ACC-01 / 담당: 지현 / 409: 이메일·닉네임 중복

        시트 요청 표기: Body: email, password, nickname

        시트 응답 표기: 201 { userId }

        Authorization 헤더를 보내면 Gateway 검증 대상이며 만료·무효 토큰은 401, 인증 확인 불가 시 503이 발생할 수 있습니다.
      x-source-row: 2
      security: []
      responses:
        "201":
          description: 201 { userId }
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: integer
                    format: int64
        "409":
          description: "409: FR-ACC-01 / 담당: 지현 / 409: 이메일·닉네임 중복"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: 비밀번호 규칙은 시트에 상세 정의되지 않았습니다.
                nickname:
                  type: string
              required:
                - email
                - password
                - nickname
  /api/users/check-email:
    get:
      tags:
        - 회원
      summary: 이메일 중복 확인
      operationId: getApiUsersCheckEmail
      description: |-
        회원가입 폼 입력 검증용

        FR-ACC-01 / 담당: 지현

        시트 요청 표기: Query: email

        시트 응답 표기: 200 { available }

        Authorization 헤더를 보내면 Gateway 검증 대상이며 만료·무효 토큰은 401, 인증 확인 불가 시 503이 발생할 수 있습니다.
      x-source-row: 3
      security: []
      responses:
        "200":
          description: 200 { available }
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
  /api/users/check-nickname:
    get:
      tags:
        - 회원
      summary: 닉네임 중복 확인
      operationId: getApiUsersCheckNickname
      description: |-
        회원가입 폼 입력 검증용 (닉네임은 UNIQUE)

        FR-ACC-01 / 담당: 지현

        시트 요청 표기: Query: nickname

        시트 응답 표기: 200 { available }

        Authorization 헤더를 보내면 Gateway 검증 대상이며 만료·무효 토큰은 401, 인증 확인 불가 시 503이 발생할 수 있습니다.
      x-source-row: 4
      security: []
      responses:
        "200":
          description: 200 { available }
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
      parameters:
        - name: nickname
          in: query
          required: true
          schema:
            type: string
  /api/auth/login:
    post:
      tags:
        - 회원
      summary: 로그인
      operationId: postApiAuthLogin
      description: >-
        Access Token과 Refresh Token 발급. Refresh Token은 Redis에 저장(유효기간 동안 보관). ACTIVE 계정만 허용. Access Token에는
        사용자 ID만 담음


        FR-ACC-01 / 담당: 지현 / 401: 이메일·비밀번호 구분 없는 통합 오류


        시트 요청 표기: Body: email, password


        시트 응답 표기: 200 { accessToken, refreshToken, userId, nickname }
      x-source-row: 5
      security: []
      responses:
        "200":
          description: 200 { accessToken, refreshToken, userId, nickname }
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  userId:
                    type: integer
                    format: int64
                  nickname:
                    type: string
        "401":
          description: "401: FR-ACC-01 / 담당: 지현 / 401: 이메일·비밀번호 구분 없는 통합 오류"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: 비밀번호 규칙은 시트에 상세 정의되지 않았습니다.
              required:
                - email
                - password
  /api/auth/reissue:
    post:
      tags:
        - 회원
      summary: 토큰 재발급
      operationId: postApiAuthReissue
      description: >-
        Redis의 Refresh Token을 확인하고 Access Token과 Refresh Token을 새로 발급. 사용한 Refresh Token은 즉시 폐기(재사용 불가). 정지·탈퇴
        계정은 거부


        FR-ACC-01 / 담당: 지현 / 401: 없거나 만료됐거나 이미 사용한 Refresh Token


        시트 요청 표기: Body: refreshToken


        시트 응답 표기: 200 { accessToken, refreshToken }
      x-source-row: 6
      security: []
      responses:
        "200":
          description: 200 { accessToken, refreshToken }
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        "401":
          description: "401: FR-ACC-01 / 담당: 지현 / 401: 없거나 만료됐거나 이미 사용한 Refresh Token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
  /api/auth/logout:
    post:
      tags:
        - 회원
      summary: 로그아웃
      operationId: postApiAuthLogout
      description: >-
        Redis의 Refresh Token 삭제. Authorization 헤더로 Access Token이 같이 오면 그 토큰도 남은 만료 시간 동안 Redis 블랙리스트에 올려 즉시
        차단. Access Token이 만료된 뒤에도 로그아웃할 수 있도록 Refresh Token만 필수


        FR-ACC-03 / 담당: 지현 / 재요청도 200(멱등) / 헤더 없이 보내면 Access Token은 만료(최대 15분)까지 유효 — FE는 로그아웃 때 헤더를 함께 전송


        시트 요청 표기: Body: refreshToken / Header: Authorization: Bearer {accessToken} (선택)


        시트 응답 표기: 200
      x-source-row: 7
      security:
        - null
        - bearerAuth: []
      responses:
        "200":
          description: "200"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
  /api/users/profile/options:
    get:
      tags:
        - 프로필
      summary: 프로필 선택지 조회
      operationId: getApiUsersProfileOptions
      description: |-
        온보딩 화면의 체형·핏·스타일 선택지 (코드 상수)

        FR-PRF-01 / 담당: 지현

        시트 요청 표기: -

        시트 응답 표기: 200 { bodyTypes[], fits[], styles[] }

        Authorization 헤더를 보내면 Gateway 검증 대상이며 만료·무효 토큰은 401, 인증 확인 불가 시 503이 발생할 수 있습니다.
      x-source-row: 9
      security: []
      responses:
        "200":
          description: 200 { bodyTypes[], fits[], styles[] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  bodyTypes:
                    type: array
                    items:
                      type: string
                  fits:
                    type: array
                    items:
                      type: string
                  styles:
                    type: array
                    items:
                      type: string
  /api/users/me:
    get:
      tags:
        - 프로필
      summary: 내 프로필 조회
      operationId: getApiUsersMe
      description: >-
        미입력 항목은 null


        FR-PRF-02 / 담당: 지현


        시트 요청 표기: -


        시트 응답 표기: 200 { email, nickname, body: { height, weight, gender, bodyType, preferredFit,
        preferredStyles[], shoeSize } }
      x-source-row: 10
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "200 { email, nickname, body: { height, weight, gender, bodyType, preferredFit,
            preferredStyles[], shoeSize } }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  nickname:
                    type: string
                  body:
                    type: object
                    properties:
                      height:
                        type: number
                        nullable: true
                      weight:
                        type: number
                        nullable: true
                      gender:
                        type: string
                        nullable: true
                      bodyType:
                        type: string
                        nullable: true
                      preferredFit:
                        type: string
                        nullable: true
                      preferredStyles:
                        type: array
                        items:
                          type: string
                        nullable: true
                      shoeSize:
                        type: number
                        nullable: true
        "401":
          description: 토큰 누락·만료·위조. 시트에 따르면 코드 없는 401.
  /api/users/me/body:
    patch:
      tags:
        - 프로필
      summary: 프로필 저장·수정·삭제
      operationId: patchApiUsersMeBody
      description: |-
        온보딩 저장과 수정에 공통 사용. 미전달 필드는 유지, null 전달 시 해당 값 삭제

        FR-PRF-01, 02 / 담당: 지현 / 400: 단위·허용 범위 오류

        시트 요청 표기: Body: height, weight, gender, bodyType, preferredFit, preferredStyles[], shoeSize (모두 선택)

        시트 응답 표기: 200 { 수정된 body }
      x-source-row: 11
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 200 { 수정된 body }
          content:
            application/json:
              schema:
                type: object
                properties:
                  height:
                    type: number
                    nullable: true
                  weight:
                    type: number
                    nullable: true
                  gender:
                    type: string
                    nullable: true
                  bodyType:
                    type: string
                    nullable: true
                  preferredFit:
                    type: string
                    nullable: true
                  preferredStyles:
                    type: array
                    items:
                      type: string
                    nullable: true
                  shoeSize:
                    type: number
                    nullable: true
        "400":
          description: "400: FR-PRF-01, 02 / 담당: 지현 / 400: 단위·허용 범위 오류"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 토큰 누락·만료·위조. 시트에 따르면 코드 없는 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                height:
                  type: number
                  nullable: true
                weight:
                  type: number
                  nullable: true
                gender:
                  type: string
                  nullable: true
                bodyType:
                  type: string
                  nullable: true
                preferredFit:
                  type: string
                  nullable: true
                preferredStyles:
                  type: array
                  items:
                    type: string
                  nullable: true
  /api/surveys:
    post:
      tags:
        - 설문
      summary: 사이즈 설문 작성
      operationId: postApiSurveys
      description: |-
        주문 서비스에서 본인 주문 항목 확인 후 저장, 추천 서비스로 선호 실측 갱신 전달

        FR-ORD-02 / 담당: 지현 / 403: 타인 주문, 409: 이미 작성

        시트 요청 표기: Body: orderItemId, sizeFeedback(SMALL/FIT/BIG)

        시트 응답 표기: 201 { surveyId }
      x-source-row: 12
      security:
        - bearerAuth: []
      responses:
        "201":
          description: 201 { surveyId }
          content:
            application/json:
              schema:
                type: object
                properties:
                  surveyId:
                    type: integer
                    format: int64
        "401":
          description: 토큰 만료(TOKEN_EXPIRED) 또는 무효(INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "403":
          description: "403: FR-ORD-02 / 담당: 지현 / 403: 타인 주문, 409: 이미 작성"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "409: FR-ORD-02 / 담당: 지현 / 403: 타인 주문, 409: 이미 작성"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 인증 확인 불가(AUTH_UNAVAILABLE), 잠시 후 재시도.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderItemId:
                  type: integer
                  format: int64
                sizeFeedback:
                  type: string
                  enum:
                    - SMALL
                    - FIT
                    - BIG
              required:
                - orderItemId
                - sizeFeedback
  /api/surveys/{surveyId}:
    patch:
      tags:
        - 설문
      summary: 사이즈 설문 수정
      operationId: patchApiSurveysSurveyId
      description: |-
        본인 설문만 수정

        FR-ORD-02 / 담당: 지현

        시트 요청 표기: Path: surveyId / Body: sizeFeedback

        시트 응답 표기: 200
      x-source-row: 13
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "200"
        "401":
          description: 토큰 만료(TOKEN_EXPIRED) 또는 무효(INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "503":
          description: 인증 확인 불가(AUTH_UNAVAILABLE), 잠시 후 재시도.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sizeFeedback:
                  type: string
                  enum:
                    - SMALL
                    - FIT
                    - BIG
              required:
                - sizeFeedback
  /api/surveys/me:
    get:
      tags:
        - 설문
      summary: 내 설문 조회
      operationId: getApiSurveysMe
      description: |-
        주문 내역 화면에서 설문 작성 여부 표시용

        FR-ORD-02 / 담당: 지현

        시트 요청 표기: Query: orderItemIds (쉼표 구분)

        시트 응답 표기: 200 [{ surveyId, orderItemId, sizeFeedback }]
      x-source-row: 14
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 200 [{ surveyId, orderItemId, sizeFeedback }]
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    surveyId:
                      type: integer
                      format: int64
                    orderItemId:
                      type: integer
                      format: int64
                    sizeFeedback:
                      type: string
        "401":
          description: 토큰 만료(TOKEN_EXPIRED) 또는 무효(INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "503":
          description: 인증 확인 불가(AUTH_UNAVAILABLE), 잠시 후 재시도.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
      parameters:
        - name: orderItemIds
          in: query
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: false
  /api/posts:
    get:
      tags:
        - 커뮤니티
      summary: 게시글 목록
      operationId: getApiPosts
      description: >-
        최신순, 삭제 글 제외, 결과 없으면 빈 목록


        FR-COM-05 / 담당: 지현


        시트 요청 표기: Query: category(FASHION/COORDI_QUESTION/DAILY), postType(VOTE), keyword, page, size


        시트 응답 표기: 200 { content: [{ postId, title, category, postType, nickname, createdAt, thumbnailUrl,
        likeCount, commentCount }], page, totalPages }


        Authorization 헤더를 보내면 Gateway 검증 대상이며 만료·무효 토큰은 401, 인증 확인 불가 시 503이 발생할 수 있습니다.
      x-source-row: 15
      security: []
      responses:
        "200":
          description: "200 { content: [{ postId, title, category, postType, nickname, createdAt, thumbnailUrl,
            likeCount, commentCount }], page, totalPages }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
