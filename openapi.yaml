components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    UserStyleTag:
      type: string
      enum:
        - CASUAL
        - MINIMAL
        - STREET
        - FORMAL
        - SPORTY
        - VINTAGE
    UserAvailabilityResponse:
      type: object
