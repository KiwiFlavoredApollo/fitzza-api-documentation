components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
    vtonServiceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: community-service 전용 서비스 토큰.
  schemas:
    VtonCreateRequest:
      type: object
      required:
      - items
      properties:
        photoId:
          type: integer
          format: int64
          nullable: true
          default: null
          description: 본인의 전신 사진 ID. 생략/null이면 기본 아바타.
        items:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required:
            - productId
            - imageUrl
            properties:
              productId:
                type: integer
                format: int64
              imageUrl:
                type: string
                format: uri
      example:
        photoId: 12
        items:
        - productId: 101
          imageUrl: https://...musinsa_green.jpg
        - productId: 204
          imageUrl: https://...musinsa_black.jpg
    VtonCreateResponse:
      type: object
      required:
      - fittingId
      properties:
        fittingId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - PENDING
          default: PENDING
    VtonProduct:
      type: object
      required:
      - productId
      - productName
      - price
      - imageUrl
      - categoryName
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        price:
          type: integer
          format: int64
          description: 상품 가격(원).
        imageUrl:
          type: string
        categoryName:
          type: string
          description: 상의, 하의, 아우터, 신발, 모자
    VtonInternalProduct:
      type: object
      required:
      - productId
      - productName
      - price
      - imageUrl
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        price:
          type: integer
          format: int64
        imageUrl:
          type: string
    VtonStatus:
      type: string
      enum:
      - PENDING
      - COMPLETED
      - FAILED
    VtonDetail:
      type: object
      required:
      - fittingId
      - userId
      - status
      - createdAt
      - updatedAt
      properties:
        fittingId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        photoId:
          type: integer
          format: int64
          nullable: true
        status:
          $ref: '#/components/schemas/VtonStatus'
        resultImageUrl:
          type: string
          nullable: true
          description: 완성 이미지 URL. PUBLIC_BASE_URL 미설정 시 /api/vton/{fittingId}/image 상대 경로.
        errorMessage:
          type: string
          nullable: true
        products:
          type: array
          items:
            $ref: '#/components/schemas/VtonProduct'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VtonInternalResult:
      type: object
      required:
      - owned
      - status
      properties:
        owned:
          type: boolean
        status:
          $ref: '#/components/schemas/VtonStatus'
        resultImageUrl:
          type: string
          nullable: true
        products:
          type: array
          items:
            $ref: '#/components/schemas/VtonInternalProduct'
    VtonError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
    VtonValidationError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: array
          items:
            type: object
            required:
            - loc
            - msg
            - type
            properties:
              loc:
                type: array
                items:
                  oneOf:
                  - type: string
                  - type: integer
              msg:
                type: string
              type:
                type: string
              input: {}
              ctx:
                type: object
                additionalProperties: true
    SignupConflict:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - errors
      properties:
        code:
          type: string
          enum:
            - DUPLICATE_VALUE
          description: 이메일과 닉네임 중복에 공통으로 사용하는 에러 코드입니다.
        message:
          type: string
          description: 회원가입 실패에 대한 요약입니다.
        errors:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: 중복된 모든 필드를 한 번씩 포함합니다. 이메일과 닉네임이 모두 중복이면 두 원인을 함께 반환합니다.
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - reason
            properties:
              field:
                type: string
                enum:
                  - email
                  - nickname
              reason:
                type: string
                description: 해당 필드가 중복되어 가입할 수 없는 원인입니다.
    Error:
      type: object
      properties:
        code:
          type: string
          description: 서비스별 코드는 시트에 정의된 경우에만 사용합니다.
        message:
          type: string
      additionalProperties: true
    GatewayError:
      type: object
      properties:
        code:
          type: string
